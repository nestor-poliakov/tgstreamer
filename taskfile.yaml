version: "3"
env:
  VIDEO: "https://www.youtube.com/watch?v=d-KxsdWX9xE"
  PLAYLIST: "https://www.youtube.com/playlist?list=PLjNlQ2vXx1xbt30X8TcUfNzw_akVISXEu"
tasks:
  run:
    desc: Run main.go
    cmds:
      - go run main.go --config=config/.local.yaml
  docker:
    desc: Build and run docker image
    cmds:
      - docker build -t tgstreamer .
      - docker run --name tgstreamer tgstreamer
  vinfo:
    desc: Get video info
    cmds:
      - yt-dlp --dump-json "$VIDEO" > local/video_info.json

  pinfo:
    desc: Get playlist info
    cmds:
      - yt-dlp --dump-json "$PLAYLIST" > local/playlist_info.json
